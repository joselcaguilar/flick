[package]
name = "flick-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
flick-core.workspace = true
fast_image_resize.workspace = true
hex.workspace = true
serde.workspace = true
sha2.workspace = true
toml.workspace = true
image.workspace = true
nalgebra.workspace = true
ndarray.workspace = true
ort.workspace = true
smallvec.workspace = true
tracing.workspace = true

# Prebuilt ONNX Runtime comes with CoreML on Apple platforms and always with DirectML on Windows;
# Linux builds are CPU-only. Requesting anything else has no prebuilt binary and fails to link.
[target.'cfg(target_vendor = "apple")'.dependencies]
ort = { workspace = true, features = ["coreml"] }

[target.'cfg(windows)'.dependencies]
ort = { workspace = true, features = ["directml"] }
