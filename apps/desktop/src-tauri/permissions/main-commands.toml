[[permission]]
identifier = "main-commands"
description = "Allows the main Flick webview to use app IPC commands."
commands.allow = [
  "engine_endpoint",
  "engine_retry",
  "show_main_window",
  "set_hud_config",
  "open_external",
  "camera_permission_status",
  "camera_request_access",
  "open_camera_privacy_settings",
  "app_preferences",
  "set_app_preferences",
  "app_info",
  "app_update_status",
  "app_update_check",
  "app_update_restart",
  "app_update_rollback",
]
