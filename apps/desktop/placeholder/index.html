<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flick</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #070a12; color: #f6f7fb; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #243b75 0, transparent 42rem), #070a12; }
      main { width: min(44rem, calc(100vw - 3rem)); border: 1px solid #2c344a; border-radius: 28px; padding: 2rem; background: color-mix(in srgb, #111827 82%, transparent); box-shadow: 0 2rem 5rem #0008; }
      h1 { margin: 0 0 .75rem; font-size: clamp(2.2rem, 8vw, 4.5rem); letter-spacing: -.08em; }
      p { color: #bec7db; line-height: 1.6; font-size: 1rem; }
      code { background: #1d2538; border-radius: .45rem; padding: .15rem .4rem; }
      .row { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.25rem; }
      button { appearance: none; border: 0; border-radius: 999px; padding: .75rem 1rem; background: #8ee6c9; color: #07130f; font-weight: 700; }
      output { display: block; margin-top: 1rem; min-height: 1.5rem; color: #9de6ff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Flick</h1>
      <p>The desktop shell is running. This placeholder is bundled from <code>apps/desktop/placeholder</code> until the React UI lane publishes <code>ui/dist</code>.</p>
      <div class="row"><button id="endpoint">Check engine sidecar</button><button id="info">App info</button></div>
      <output id="out">Ready.</output>
    </main>
    <script type="module">
      const out = document.querySelector('#out');
      async function invoke(cmd, args = {}) {
        const api = window.__TAURI__?.core;
        if (!api) throw new Error('Tauri API unavailable');
        return api.invoke(cmd, args);
      }
      document.querySelector('#endpoint').addEventListener('click', async () => {
        try { const endpoint = await invoke('engine_endpoint'); out.textContent = `${endpoint.base_url} token=${endpoint.token.slice(0, 8)}…`; }
        catch (error) { out.textContent = String(error); }
      });
      document.querySelector('#info').addEventListener('click', async () => {
        try { out.textContent = JSON.stringify(await invoke('app_info')); }
        catch (error) { out.textContent = String(error); }
      });
    </script>
  </body>
</html>
