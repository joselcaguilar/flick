<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flick HUD</title>
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .hud { box-sizing: border-box; width: 360px; height: 96px; border-radius: 28px; border: 1px solid color-mix(in srgb, white 18%, transparent); background: color-mix(in srgb, #08111f 82%, transparent); color: white; display: grid; place-items: center; box-shadow: 0 16px 48px #0008; backdrop-filter: blur(18px); }
      strong { font-size: 20px; letter-spacing: -.03em; }
      span { display: block; color: #b7c6dc; font-size: 13px; margin-top: 4px; text-align: center; }
    </style>
  </head>
  <body><div class="hud"><div><strong>Flick HUD</strong><span>Placeholder overlay</span></div></div></body>
</html>
