name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every day at 3 AM, so new CodeQL queries also check code that hasn't changed.
    - cron: "0 3 * * *"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@v4
      # CodeQL runs Rust build scripts, and Tauri's GTK/WebKit crates look up these libraries.
      - name: Install Tauri system libraries
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Generated by MSW; Biome skips it too.
          config: |
            paths-ignore:
              - ui/public/mockServiceWorker.js
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
