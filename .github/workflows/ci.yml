name: CI

# Runs only for releases and on demand. A published release gets the unsigned bundles attached
# once every check passes; a manual run keeps them as workflow artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Bash everywhere, so a failing line fails the step on Windows too.
    shell: bash

jobs:
  rust-lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Rust format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Test
        run: cargo test --workspace

  deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Licenses
        run: cargo deny --all-features check licenses

  ui:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 12.9.1
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  ui-design:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 12.9.1
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Run design detector
        run: pnpm detect

  # TODO(P1-602): api-drift once cargo xtask gen-api writes generated TS types.
  # api-drift:
  #   runs-on: ubuntu-22.04

  # The baseline models are not committed; build them once from their pinned sources.
  models:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the gesture model converter
        run: >-
          pip install tensorflow==2.21.0 tf2onnx==1.17.0 onnx==1.23.0 numpy==2.5.3
          protobuf==7.36.2 flatbuffers==25.12.19
      - name: Fetch and convert
        run: |
          python tools/training/convert.py fetch palm hand_landmark blazeface_short_range gesture_recognizer_task
          python tools/training/convert.py convert-gesture
      - name: Verify against models/manifest.toml
        run: node apps/desktop/scripts/prepare-models.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: baseline-models
          path: |
            models/cache/palm_detection_full.onnx
            models/cache/hand_landmark_full.onnx
            models/cache/gesture_embedder.onnx
            models/cache/canned_gesture_classifier.onnx
            models/cache/face_detection_short.onnx
          if-no-files-found: error

  bundle:
    name: bundle (${{ matrix.name }})
    needs: models
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            bundles: nsis
            path: target/release/bundle/nsis/*.exe
          - name: windows-arm64
            runner: windows-11-arm
            bundles: nsis
            path: target/release/bundle/nsis/*.exe
          - name: macos-arm64
            runner: macos-15
            bundles: dmg
            path: target/release/bundle/dmg/*.dmg
          - name: linux-x64
            runner: ubuntu-22.04
            bundles: appimage,deb
            path: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            bundles: appimage,deb
            path: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: pnpm/action-setup@v5
        with:
          version: 12.9.1
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml
      - uses: actions/download-artifact@v7
        with:
          name: baseline-models
          path: models/cache
      - name: Build UI
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build
      - name: Install desktop dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Build unsigned bundle
        env:
          # Ad-hoc signature only: Apple Silicon refuses to open unsigned apps, and there is no
          # Developer ID yet.
          APPLE_SIGNING_IDENTITY: "-"
          # linuxdeploy is itself an AppImage, and the runners have no FUSE to mount it.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm --dir apps/desktop tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v6
        with:
          name: flick-${{ matrix.name }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: [rust-lint, rust-test, deny, ui, ui-design, bundle]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: flick-*
          path: dist
          merge-multiple: true
      - name: Attach unsigned bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mapfile -t files < <(find dist -type f)
          gh release upload "$TAG" "${files[@]}" --clobber
