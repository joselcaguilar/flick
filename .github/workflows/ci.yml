name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust-lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Rust format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Test
        run: cargo test --workspace

  deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Enable pnpm
        run: corepack enable
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: ui
        run: pnpm lint
      - name: Typecheck
        working-directory: ui
        run: pnpm typecheck
      - name: Test
        working-directory: ui
        run: pnpm test
      - name: Build
        working-directory: ui
        run: pnpm build

  ui-design:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Enable pnpm
        run: corepack enable
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Run design detector
        working-directory: ui
        run: pnpm detect

  # TODO(P1-602): api-drift once cargo xtask gen-api writes generated TS types.
  # api-drift:
  #   runs-on: ubuntu-22.04

  build-bundles:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install desktop dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Build unsigned preview bundle
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) pnpm --dir apps/desktop tauri build --debug --bundles app ;;
            Windows) pnpm --dir apps/desktop tauri build --debug --bundles nsis ;;
            Linux) pnpm --dir apps/desktop tauri build --debug --bundles appimage,deb ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: flick-${{ matrix.os }}-preview
          path: target/debug/bundle/**
          if-no-files-found: error
