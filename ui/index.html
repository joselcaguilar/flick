<!doctype html>
<!--
  Direction contract (see DESIGN.md)
  THESIS: A GitHub-grade operations console for the home. Calm Primer chrome; only the live camera is vivid.
          Refuses consumer tiles, gradients and Liquid Glass.
  OWN-WORLD: Mona Sans + Monaspace Neon; GitHub's six themes; 1px borders; 6/12px radii; flat fills;
             one accent blue; semantic colors; Boxes with divided lists; no nested cards, blur or gradients.
  STORY: Status at a glance, then what Flick sees and did, then one primary action per screen.
  FIRST VIEWPORT: Sidebar nav, flat header bar, 28px title, preview Box at 2/3 width beside a status column.
  FORM: GitHub Primer canon, played straight (owner-pinned).
-->
